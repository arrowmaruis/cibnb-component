<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Clone - HTML + Tailwind + Alpine.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @font-face {
            font-family: 'Airbnb Cereal';
            src: url('assets/fonts/AirbnbCerealVF_W_Wght.8816d9e5c3b6a860636193e36b6ac4e4.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Airbnb Cereal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen bg-white" x-data="airbnbData()">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-100">
        <div class="max-w-[1760px] mx-auto px-6 sm:px-10 lg:px-16 xl:px-24">
            <div class="flex items-center justify-center h-20">
                <!-- Barre de recherche centrée -->
                <div class="flex items-center border border-gray-300 rounded-full shadow-sm hover:shadow-lg transition-all duration-200 bg-white">
                    <button class="px-6 py-3 hover:bg-gray-50 rounded-full transition-colors">
                        <span class="text-sm font-semibold text-gray-800">Où</span>
                    </button>
                    <div class="h-8 w-px bg-gray-300"></div>
                    <button class="px-6 py-3 hover:bg-gray-50 transition-colors">
                        <span class="text-sm font-semibold text-gray-800">Quand</span>
                    </button>
                    <div class="h-8 w-px bg-gray-300"></div>
                    <button class="flex items-center gap-3 pl-6 pr-2 py-2 hover:bg-gray-50 rounded-full transition-colors">
                        <span class="text-sm font-semibold text-gray-800">Voyageurs</span>
                        <div class="bg-orange-500 p-3 rounded-full hover:bg-orange-600 transition-colors">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </header>
    

    <!-- Contenu principal -->
    <main class="max-w-[2000px] mx-auto px-6 sm:px-10 lg:px-16 xl:px-24 py-8">
        <!-- Section Hôtels Madrid -->
        <section class="mb-10">
            <div class="flex items-center gap-2 mb-4">
                <h2 class="text-[22px] font-semibold text-gray-900">Hôtels à la une (Madrid)</h2>
                <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none">
                    <path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <p class="text-gray-500 text-[15px] -mt-2 mb-4">Une collection d'hôtels indépendants et triés sur le volet</p>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 gap-4 sm:gap-5 xl:gap-6">
                <template x-for="hotel in madridHotels" :key="hotel.id">
                    <div class="cursor-pointer group">
                        <div class="relative aspect-square rounded-3xl overflow-hidden mb-2">
                            <img
                                :src="hotel.image"
                                :alt="hotel.name"
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                            />
                        </div>
                        <div class="space-y-0.5">
                            <h3 class="font-medium text-[15px] text-gray-900 truncate" x-text="hotel.name"></h3>
                            <p class="text-gray-900 text-[15px] font-semibold"><span x-text="hotel.price"></span> € <span class="text-gray-500 font-normal">pour 2 nuits</span></p>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Section Marrakech -->
        <section class="mb-10">
            <div class="flex items-center gap-2 mb-4">
                <h2 class="text-[22px] font-semibold text-gray-900">Logements disponibles le mois prochain · Marrakech</h2>
                <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none">
                    <path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 gap-4 sm:gap-5 xl:gap-6">
                <template x-for="apartment in marrakechApartments" :key="apartment.id">
                    <div class="cursor-pointer group">
                        <div class="relative aspect-square rounded-3xl overflow-hidden mb-2">
                            <img
                                :src="apartment.image"
                                :alt="apartment.name"
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                            />
                        </div>
                        <div class="space-y-0.5">
                            <h3 class="font-medium text-[15px] text-gray-900 truncate" x-text="apartment.name"></h3>
                            <p class="text-gray-500 text-[15px]" x-text="apartment.dates"></p>
                            <p class="text-gray-900 text-[15px] font-semibold"><span x-text="apartment.price"></span> € <span class="text-gray-500 font-normal">pour 2 nuits</span></p>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Section Dakar -->
        <section class="mb-10">
            <div class="flex items-center gap-2 mb-4">
                <h2 class="text-[22px] font-semibold text-gray-900">Logements · Dakar</h2>
                <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none">
                    <path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 gap-4 sm:gap-5 xl:gap-6">
                <template x-for="apartment in dakarApartments" :key="apartment.id">
                    <div class="cursor-pointer group">
                        <div class="relative aspect-square rounded-3xl overflow-hidden mb-2">
                            <img
                                :src="apartment.image"
                                :alt="apartment.name"
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                            />
                        </div>
                        <div class="space-y-0.5">
                            <h3 class="font-medium text-[15px] text-gray-900 truncate" x-text="apartment.name"></h3>
                            <p class="text-gray-900 text-[15px] font-semibold"><span x-text="apartment.price"></span> € <span class="text-gray-500 font-normal">pour 2 nuits</span></p>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </main>
