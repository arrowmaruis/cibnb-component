<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Interface Services</title>
</head>
<body class="bg-white min-h-screen font-sans antialiased flex flex-col">

    <header class="w-full px-12 py-6 flex justify-between items-center bg-white">
        <div class="text-[#FF385C]">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 fill-current">
                <path d="M16 1c2.008 0 3.463.963 4.751 3.269l.533 1.025c1.954 3.83 6.114 12.54 7.1 14.836l.145.353c.667 1.591.91 2.472.96 3.396l.01.415.001.228c0 4.062-2.877 6.478-6.357 6.478-2.224 0-4.556-1.258-6.709-3.386l-.257-.26-.172-.179h-.011l-.176.185c-2.044 2.1-4.392 3.42-6.72 3.636l-.248.015-.243.004c-3.48 0-6.357-2.416-6.357-6.478 0-1.212.27-2.316.824-3.468l.11-.223.145-.353c.987-2.296 5.147-11.006 7.101-14.837l.533-1.024C12.537 1.963 13.992 1 16 1zm0 2c-1.239 0-2.053.539-3.003 2.223l-.533 1.025C10.51 9.078 6.35 17.788 5.363 20.084l-.145.353c-.466 1.114-.64 1.841-.665 2.531l-.003.228c0 2.845 2.022 4.478 4.357 4.478 1.705 0 3.614-.99 5.607-2.903l.422-.423L16 23.32l1.063 1.03.423.422c1.993 1.914 3.902 2.903 5.607 2.903 2.335 0 4.357-1.633 4.357-4.478 0-1.123-.217-1.926-.662-2.983l-.151-.353c-.987-2.296-5.147-11.006-7.101-14.837l-.533-1.024C18.053 3.539 17.24 3 16 3z"/>
            </svg>
        </div>
        <button class="bg-[#F3F4F6] text-[#222222] px-7 py-2.5 rounded-full font-medium text-sm border border-gray-100 shadow-sm hover:bg-gray-200 transition-colors">
            Retour
        </button>
    </header>

    <main class="flex-1 flex flex-col md:flex-row items-center justify-center max-w-6xl mx-auto w-full px-12 gap-20">
        
        <div class="flex-1 space-y-8">
            <h1 class="text-4xl md:text-[2.75rem] font-semibold text-[#222222] leading-tight tracking-tight">
                Où proposerez-vous <br> votre service ?
            </h1>
            
            <div class="relative w-full max-w-[340px]">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </div>
                <input 
                    type="text" 
                    placeholder="Saisir une ville" 
                    class="w-full pl-12 pr-4 py-4 bg-white border border-gray-300 rounded-2xl text-base text-gray-900 focus:outline-none focus:ring-1 focus:ring-black shadow-sm"
                >
            </div>
        </div>

        <div class="flex-shrink-0">
            <div class="w-[280px] bg-white border border-gray-50 rounded-[2.5rem] p-10 flex flex-col items-center justify-between aspect-[0.85/1] shadow-[0_30px_60px_-12px_rgba(0,0,0,0.25)]">
                <div class="flex-1 flex items-center justify-center w-full">
                    <img src="service-img/vernis.avif" alt="Mani-pédi" class="max-w-full max-h-[140px] object-contain">
                </div>
                <p class="font-semibold text-[#222222] text-center text-lg mt-6">Mani-pédi</p>
            </div>
        </div>

    </main>

    <footer class="w-full border-t border-gray-200 py-5 px-12 bg-white mt-auto">
        <div class="max-w-6xl mx-auto flex justify-end">
            <button class="bg-[#222222] text-white px-9 py-3 rounded-xl font-bold text-base hover:bg-black transition-all active:scale-95 shadow-md">
                Suivant
            </button>
        </div>
    </footer>

</body>
</html>
