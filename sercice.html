<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Interface Services Airbnb</title>
</head>
<body class="bg-white p-6 md:p-10 font-sans antialiased">

    <header class="max-w-[1300px] mx-auto flex justify-between items-center mb-16">

        </div>
        <button class="bg-[#F3F4F6] hover:bg-gray-200 text-gray-900 px-6 py-2 rounded-2xl font-semibold text-sm transition-all shadow-sm">
            Retour
        </button>
    </header>

    <section class="max-w-[1300px] mx-auto text-center mb-16">
        <h1 class="text-4xl md:text-5xl font-semibold text-[#222222] tracking-tight">
            Quel service souhaitez-vous proposer ?
        </h1>
    </section>

    <main class="max-w-[1300px] mx-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5">
        
        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/cuisine.avif" alt="Chef privé" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Chef privé</p>
        </div>

        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/coaching.avif" alt="Coaching" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Coaching privé</p>
        </div>

        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/coiffure.avif" alt="Coiffure" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Coiffure</p>
        </div>

        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/vernis.avif" alt="Mani-pédi" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Mani-pédi</p>
        </div>

        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/makeup.avif" alt="Maquillage" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Maquillage</p>
        </div>

        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/massage.avif" alt="Massage" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Massage</p>
        </div>

        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/photo.avif" alt="Photographie" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Photographie</p>
        </div>

        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/nourriture.avif" alt="Plats préparés" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Plats préparés</p>
        </div>

        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/traiteur.avif" alt="Traiteur" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Service de traiteur</p>
        </div>

        <div class="group border border-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-between aspect-[0.9/1] hover:border-black transition-all cursor-pointer bg-white">
            <div class="flex-1 flex items-center justify-center w-full p-2">
                <img src="service-img/bienetre.avif" alt="Soins" class="max-w-full max-h-[120px] object-contain">
            </div>
            <p class="font-semibold text-[#222222] text-center text-base mt-2">Soins bien-être</p>
        </div>

    </main>

</body>
</html>
