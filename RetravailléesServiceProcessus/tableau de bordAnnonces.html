<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon annonce</title>
    <style>
        :root {
            --text-primary: #222222;
            --text-secondary: #717171;
            --bg-hover: #f7f7f7;
            --card-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            width: 100%;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--bg-hover);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-primary);
            fill: none;
            stroke-width: 3;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* 3D Illustration Cards */
        .illustration-container {
            position: relative;
            width: 220px;
            height: 140px;
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .card {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        /* SVG Styles for "3D" look */
        .card svg {
            width: 60%;
            height: 60%;
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.15));
        }

        .card.left {
            transform: translateX(-50px) rotate(-15deg) translateZ(0);
            z-index: 1;
        }

        .card.center {
            transform: translateY(-20px) translateZ(20px);
            z-index: 2;
        }

        .card.right {
            transform: translateX(50px) rotate(15deg) translateZ(0);
            z-index: 1;
        }

        /* Hover Interactions */
        .illustration-container:hover .card.left {
            transform: translateX(-65px) rotate(-20deg) scale(1.05);
        }
        .illustration-container:hover .card.right {
            transform: translateX(65px) rotate(20deg) scale(1.05);
        }
        .illustration-container:hover .card.center {
            transform: translateY(-30px) scale(1.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .description {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 32px;
            max-width: 400px;
            line-height: 1.5;
        }

        .cta-button {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid #b0b0b0;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cta-button:hover {
            border-color: #222;
            background-color: #f7f7f7;
            transform: translateY(-1px);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* Responsiveness */
        @media (max-width: 600px) {
            .top-bar { padding: 24px 24px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Mon annonce</h1>
        <div class="controls">
            <!-- Menu Icon -->
            <button class="icon-btn" aria-label="Menu">
                <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><g fill="none" fill-rule="evenodd"><path d="M2 16h28M2 24h28M2 8h28"></path></g></svg>
            </button>
            <!-- Plus Icon -->
            <button class="icon-btn" aria-label="Créer">
                 <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M2 16h28M16 2v28"></path></svg>
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="illustration-container">
            
            <!-- House Card (Left) -->
            <div class="card left">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#FF5A5F;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#D93946;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <!-- House Body -->
                    <rect x="20" y="45" width="60" height="45" rx="4" fill="url(#wallGrad)" />
                    <!-- Door -->
                    <rect x="42" y="65" width="16" height="25" rx="2" fill="#484848" />
                    <!-- Roof -->
                    <path d="M10 50 L50 10 L90 50 L85 55 L50 20 L15 55 Z" fill="url(#roofGrad)" />
                    <!-- Chimney -->
                    <rect x="70" y="25" width="10" height="15" fill="#D93946" />
                </svg>
            </div>

            <!-- Balloon Card (Center) -->
            <div class="card center">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="balloonGrad" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
                            <stop offset="0%" style="stop-color:#FF9E9E;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#FF385C;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#A80020;stop-opacity:1" />
                        </radialGradient>
                    </defs>
                    <!-- String -->
                    <path d="M50 80 Q55 90 50 100" stroke="#717171" stroke-width="2" fill="none" />
                    <!-- Balloon -->
                    <circle cx="50" cy="45" r="35" fill="url(#balloonGrad)" />
                    <!-- Triangle tie -->
                    <path d="M45 78 L55 78 L50 85 Z" fill="#A80020" />
                    <!-- Shine -->
                    <ellipse cx="35" cy="30" rx="8" ry="5" transform="rotate(-45 35 30)" fill="white" opacity="0.4" />
                </svg>
            </div>

            <!-- Bell Card (Right) -->
            <div class="card right">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <!-- Bell Body -->
                    <path d="M50 15 C30 15 20 40 20 60 L15 65 L85 65 L80 60 C80 40 70 15 50 15 Z" fill="url(#bellGrad)" />
                    <!-- Clapper -->
                    <circle cx="50" cy="72" r="8" fill="#B8860B" />
                    <!-- Shine line -->
                    <path d="M35 30 Q40 60 30 60" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5" fill="none"/>
                </svg>
            </div>

        </div>

        <p class="description">
            Créez une annonce avec Airbnb Start pour commencer à recevoir des réservations.
        </p>

        <button class="cta-button">
            Créer une annonce
        </button>
    </div>

</body>
</html>
