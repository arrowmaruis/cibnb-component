<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Style Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Input Floating Label Animation Styles */
        .floating-input:focus ~ .floating-label,
        .floating-input:not(:placeholder-shown) ~ .floating-label {
            top: 6px;
            font-size: 12px;
            color: #717171;
            transform: translateY(0);
        }

        .floating-label {
            top: 18px;
            left: 16px;
            font-size: 16px;
            color: #717171;
            transition: all 0.1s ease-out;
            pointer-events: none;
            position: absolute;
            transform: translateY(-50%);
        }

        /* Custom focus ring for the group to mimic Airbnb's contiguous border focus */
        .input-group-item:focus-within {
            z-index: 10;
            box-shadow: inset 0 0 0 2px black;
            border-radius: 8px;
            border-color: transparent;
        }

        /* Remove default outline */
        input:focus, select:focus {
            outline: none;
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-white h-screen flex flex-col justify-between text-[#222222]">

    <!-- Navbar -->
    <header class="flex items-center justify-between px-6 py-8 md:px-12 bg-white shrink-0">
        <!-- Back Button -->
        <button class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center hover:shadow-md transition-shadow hover:bg-gray-50">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>

        <!-- Step Indicator (Hidden on small mobile for cleaner look, visible on desktop) -->
        <div class="hidden md:block text-sm font-semibold">
            À propos de vous <span class="mx-1 text-gray-400">•</span> Étape 1 sur 6
        </div>

        <!-- Save & Exit -->
        <button class="px-4 py-2 bg-[#F7F7F7] hover:bg-[#EBEBEB] text-sm font-semibold rounded-full transition-colors border border-transparent hover:border-[#DDDDDD]">
            Enregistrer et quitter
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-6 md:px-12 w-full max-w-[680px] mx-auto flex flex-col">
        <div class="mt-4 md:mt-8">
            <h1 class="text-[26px] md:text-[32px] font-semibold leading-snug mb-4 text-[#222222]">
                Parlez-nous un peu de vous
            </h1>
            
            <p class="text-gray-500 text-lg mb-10 leading-relaxed">
                Cette étape est obligatoire pour nous conformer aux réglementations financières et nous aider à lutter contre la fraude.
            </p>

            <div class="mb-4">
                <h2 class="text-base font-medium mb-1">Quelle est votre adresse résidentielle ?</h2>
                <p class="text-sm text-gray-500 mb-6">Les voyageurs ne verront pas ces informations.</p>
            </div>

            <!-- Form Container -->
            <div class="flex flex-col rounded-lg border border-gray-400 divide-y divide-gray-400">
                
                <!-- Country Select -->
                <div class="relative input-group-item h-[56px] bg-white rounded-t-lg group cursor-pointer">
                    <label class="absolute top-2 left-4 text-xs text-gray-500 z-0">Pays/région</label>
                    <div class="absolute bottom-2 left-4 text-base text-[#222222] z-0">Côte d'Ivoire</div>
                    
                    <!-- Chevron Icon -->
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#222222]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>

                    <select class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10 appearance-none">
                        <option value="CI">Côte d'Ivoire</option>
                        <option value="FR">France</option>
                        <option value="BE">Belgique</option>
                        <option value="CA">Canada</option>
                    </select>
                </div>

                <!-- Street Input -->
                <div class="relative input-group-item h-[56px] bg-white">
                    <input type="text" id="street" class="floating-input w-full h-full px-4 pt-5 pb-1 bg-transparent text-[#222222] placeholder-transparent" placeholder=" ">
                    <label for="street" class="floating-label">Numéro et libellé de voie</label>
                </div>

                <!-- Apt Input -->
                <div class="relative input-group-item h-[56px] bg-white rounded-b-lg">
                    <input type="text" id="apt" class="floating-input w-full h-full px-4 pt-5 pb-1 bg-transparent text-[#222222] placeholder-transparent" placeholder=" ">
                    <label for="apt" class="floating-label whitespace-nowrap overflow-hidden text-ellipsis w-[90%]">Appartement, étage, immeuble (si applicable)</label>
                </div>

            </div>
            
            <!-- Bottom spacer to ensure content isn't hidden behind footer -->
            <div class="h-24"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 px-6 py-4 md:px-12 flex items-center justify-between shrink-0 fixed bottom-0 left-0 w-full z-50">
        <!-- Progress bar visual (top border acts as line) -->
        <div class="absolute top-0 left-0 h-[2px] bg-black w-[15%] transition-all duration-500"></div>

        <button class="text-sm font-semibold underline text-[#222222] hover:bg-[#F7F7F7] px-4 py-2 rounded-lg -ml-4 transition-colors">
            Retour
        </button>

        <button id="nextBtn" class="bg-[#DDDDDD] text-white px-8 py-3.5 rounded-lg font-semibold cursor-not-allowed transition-all duration-200" disabled>
            Suivant
        </button>
    </footer>

    <script>
        const streetInput = document.getElementById('street');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.querySelector('footer > div');

        // Function to validate form
        function validateForm() {
            if (streetInput.value.trim().length > 0) {
                // Enable button
                nextBtn.disabled = false;
                nextBtn.classList.remove('bg-[#DDDDDD]', 'cursor-not-allowed');
                nextBtn.classList.add('bg-[#222222]', 'hover:bg-black', 'hover:scale-[1.02]');
                
                // Advance progress bar slightly to show activity
                progressBar.style.width = '20%';
            } else {
                // Disable button
                nextBtn.disabled = true;
                nextBtn.classList.add('bg-[#DDDDDD]', 'cursor-not-allowed');
                nextBtn.classList.remove('bg-[#222222]', 'hover:bg-black', 'hover:scale-[1.02]');
                
                progressBar.style.width = '15%';
            }
        }

        // Listen for input
        streetInput.addEventListener('input', validateForm);

        // Ripple effect simulation on click
        nextBtn.addEventListener('click', function(e) {
            if(this.disabled) return;
            
            // Visual feedback
            this.innerHTML = `
                <div class="flex items-center justify-center space-x-2">
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            `;
            
            setTimeout(() => {
                this.innerHTML = "Suivant";
                // Mock success flash
                this.classList.add('bg-green-600');
                setTimeout(() => this.classList.remove('bg-green-600'), 200);
            }, 800);
        });
    </script>
</body>
</html>
