<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Style - Étape 4 Offres</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Animation d'entrée pour les cartes */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translate(-50%, 20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
        }

        .offer-card {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            padding: 12px;
            width: 280px;
            transition: all 0.3s ease;
        }

        /* Positionnement spécifique des cartes pour l'effet d'empilement */
        .card-1 {
            top: 0;
            z-index: 1;
            transform: translate(-50%, 0) scale(0.9);
            opacity: 0.7;
            animation: slideUpFade 0.6s ease-out 0.1s backwards;
        }
        .card-2 {
            top: 45px;
            z-index: 2;
            transform: translate(-50%, 0) scale(0.95);
            opacity: 0.9;
            animation: slideUpFade 0.6s ease-out 0.2s backwards;
        }
        .card-3 {
            top: 90px;
            z-index: 3;
            transform: translate(-50%, 0) scale(1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            animation: slideUpFade 0.6s ease-out 0.3s backwards;
        }

        .card-img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            margin-right: 12px;
        }

        .btn-black {
            background-color: #222222;
            color: white;
            transition: transform 0.1s ease, background-color 0.2s;
        }
        .btn-black:hover {
            background-color: black;
        }
        .btn-black:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-white h-screen flex flex-col justify-between text-[#222222] overflow-hidden">

    <!-- Navbar -->
    <header class="flex items-center justify-between px-6 py-8 md:px-12 bg-white shrink-0 z-10">
        <button class="w-8 h-8 rounded-full border border-transparent hover:bg-gray-100 flex items-center justify-center transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <!-- Pas de titre d'étape spécifique affiché sur cet écran introductif dans la capture, mais on peut le garder vide ou discret -->
        <div class="hidden md:block"></div>
        
        <button class="px-4 py-2 bg-[#F7F7F7] hover:bg-[#EBEBEB] text-sm font-semibold rounded-full transition-colors border border-transparent">
            Enregistrer et quitter
        </button>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-1 overflow-y-auto w-full max-w-[600px] mx-auto flex flex-col items-center justify-center px-6 md:px-12 pb-20">
        
        <!-- Illustration des cartes empilées -->
        <div class="relative w-full h-[240px] mb-8">
            <!-- Carte 1 (Fond) -->
            <div class="offer-card card-1">
                <img src="https://images.unsplash.com/photo-1632345031435-8727f6897d53?auto=format&fit=crop&q=80&w=100" class="card-img" alt="Manucure">
                <div>
                    <div class="text-sm font-bold text-gray-800">Manucure</div>
                    <div class="text-xs text-gray-500">$40 au total</div>
                </div>
            </div>
            
            <!-- Carte 2 (Milieu) -->
            <div class="offer-card card-2">
                <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&q=80&w=100" class="card-img" alt="Nail art simple">
                <div>
                    <div class="text-sm font-bold text-gray-800">Nail art simple</div>
                    <div class="text-xs text-gray-500">$60 au total</div>
                </div>
            </div>

            <!-- Carte 3 (Devant) -->
            <div class="offer-card card-3">
                <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&q=80&w=100" class="card-img" alt="Nail art personnalisé">
                <div>
                    <div class="text-sm font-bold text-gray-800">Nail art personnalisé</div>
                    <div class="text-xs text-gray-500">$80 au total</div>
                </div>
            </div>
        </div>

        <!-- Textes -->
        <div class="text-center max-w-md">
            <h1 class="text-[32px] font-semibold leading-tight mb-4 text-[#222222]">
                Créez vos offres
            </h1>
            <p class="text-gray-500 text-lg leading-relaxed">
                Il s'agit de ce que les voyageurs réserveront. Vous ajouterez une photo, quelques informations et un prix.
            </p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 px-6 py-4 md:px-12 flex items-center justify-between shrink-0 sticky bottom-0 w-full z-10">
        <!-- Barre de progression (Environ 60%) -->
        <div class="absolute top-0 left-0 h-[2px] bg-black w-[60%] transition-all duration-500"></div>
        
        <button class="text-sm font-semibold underline text-[#222222] hover:bg-[#F7F7F7] px-4 py-2 rounded-lg -ml-4 transition-colors">
            Retour
        </button>
        
        <button class="btn-black px-8 py-3.5 rounded-lg font-semibold text-white">
            Suivant
        </button>
    </footer>

</body>
</html>
