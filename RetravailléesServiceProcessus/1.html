<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Étape 1 - Expérience</title>
<style>
    :root {
        color-scheme: light;
        font-family: "Manrope", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f7f7f7;
        --card-bg: #ffffff;
        --text-primary: #1f1f1f;
        --text-secondary: #6b6b6b;
        --border: #e4e4e4;
        --accent: #111111;
    }
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        color: var(--text-primary);
    }
    .card {
        width: min(100%, 860px);
        height: min(600px, calc(100vh - 32px));
        background: var(--card-bg);
        border-radius: 28px;
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: clamp(20px, 4vw, 40px);
        gap: clamp(24px, 3vw, 40px);
    }
    .progress-wrapper {
        width: 100%;
    }
    .progress-track {
        width: 100%;
        height: 4px;
        background: #ececec;
        border-radius: 999px;
        overflow: hidden;
    }
    .progress-fill {
        width: 20%;
        height: 100%;
        background: var(--accent);
        border-radius: inherit;
    }
    .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 16px;
        padding: 0 5%;
    }
    .step-label {
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--text-secondary);
        font-weight: 600;
    }
    h1 {
        font-size: clamp(1.8rem, 4vw, 3rem);
        margin: 0;
        font-weight: 600;
    }
    .counter {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-top: 32px;
    }
    .circle-btn {
        width: clamp(56px, 10vw, 72px);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        background: white;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .circle-btn:hover {
        border-color: var(--text-primary);
        color: var(--text-primary);
    }
    .count-value {
        font-size: clamp(3rem, 8vw, 5rem);
        font-weight: 700;
        min-width: 120px;
    }
    .count-unit {
        font-size: 1rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }
    .footer {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--border);
        padding-top: 20px;
    }
    .link-btn {
        background: none;
        border: none;
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
        color: var(--text-primary);
        padding: 0;
    }
    .primary-btn {
        border: none;
        border-radius: 16px;
        padding: 16px 32px;
        background: var(--accent);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }
    .primary-btn:hover {
        background: #000000;
    }
    @media (max-width: 640px) {
        .card {
            border-radius: 20px;
            height: auto;
            min-height: calc(100vh - 32px);
        }
        .counter {
            flex-direction: column;
            gap: 12px;
        }
        .footer {
            flex-direction: column;
            align-items: stretch;
        }
        .primary-btn {
            width: 100%;
        }
        .link-btn {
            width: 100%;
            text-align: center;
        }
    }
</style>
</head>
<body>
<div class="card">
    <div class="progress-wrapper">
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
    </div>

    <div class="content">
        <div class="step-label">À propos de vous · Étape 1 sur 6</div>
        <h1>Depuis combien d'années travaillez-vous dans la coiffure&nbsp;?</h1>
        <div class="counter" aria-live="polite">
            <button class="circle-btn" data-change="-1" aria-label="Réduire d'un an">−</button>
            <div>
                <div class="count-value" id="countValue">10</div>
                <div class="count-unit">ans</div>
            </div>
            <button class="circle-btn" data-change="1" aria-label="Augmenter d'un an">+</button>
        </div>
    </div>

    <div class="footer">
        <button class="link-btn" type="button">Obtenir des conseils</button>
        <button class="primary-btn" type="button">Suivant</button>
    </div>
</div>

<script>
(() => {
    const valueEl = document.getElementById('countValue');
    let count = parseInt(valueEl.textContent, 10);

    document.querySelectorAll('.circle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const delta = Number(btn.dataset.change);
            count = Math.max(0, Math.min(60, count + delta));
            valueEl.textContent = count;
        });
    });
})();
</script>
</body>
</html>
